name: Release

on:
  push:
    tags: ['v*']
  # Manual dry run. Everything here except publishing is otherwise unreachable until a
  # tag is pushed, so a broken action bump is discovered with the tag already live and a
  # half-published release to clean up. Dispatching from a branch exercises the whole
  # build matrix and publishes nothing — see the guard on the release job.
  workflow_dispatch:

env:
  GO_VERSION: '1.27'

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux, goarch: amd64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          VERSION="${{ github.ref_name || 'dev' }}"
          GIT_COMMIT="${{ github.sha }}"
          BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
          go build -ldflags="-w -s -X 'github.com/1mb-dev/markgo/internal/constants.AppVersion=${VERSION}' -X 'github.com/1mb-dev/markgo/internal/constants.GitCommit=${GIT_COMMIT}' -X 'github.com/1mb-dev/markgo/internal/constants.BuildTime=${BUILD_TIME}'" \
            -o markgo-${{ matrix.target.goos }}-${{ matrix.target.goarch }}${EXT} \
            ./cmd/markgo

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: markgo-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: markgo-*
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-artifacts
    # Publishing is gated on the ref being a tag, not on the event name — a dry run from
    # a branch would otherwise cut a GitHub release named after that branch.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release
        run: |
          mkdir -p release
          find artifacts -name "markgo-*" -type f -exec cp {} release/ \;

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          generate_release_notes: true
